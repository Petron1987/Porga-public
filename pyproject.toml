[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "porga"
version = "0.4.0"
description = "Self-Evolving Agent Organization System: a governed local kernel"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["openai-agents==0.24.0", "pydantic==2.14.2"]

[project.urls]
Repository = "https://github.com/Petron1987/Porga-public"
Issues = "https://github.com/Petron1987/Porga-public/issues"

[project.optional-dependencies]
dev = ["pytest==9.2.0", "pytest-asyncio==1.4.1.post1", "ruff==0.17.3"]

[project.scripts]
porga = "porga.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
